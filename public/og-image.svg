<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040406" />
      <stop offset="50%" stop-color="#0A0812" />
      <stop offset="100%" stop-color="#1A050D" />
    </linearGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E56" />
      <stop offset="50%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Retro Grid Lines -->
  <g stroke="rgba(255, 30, 86, 0.08)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glowing Outer Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#FF1E56" stroke-width="2" opacity="0.4" />
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3" />

  <!-- Fly Compound Eye Icon -->
  <text x="600" y="190" font-size="90" text-anchor="middle" filter="url(#glow)">🪰</text>

  <!-- Title: DOOM-FLY -->
  <text x="600" y="300" font-family="monospace, sans-serif" font-size="84" font-weight="900" fill="url(#neonText)" text-anchor="middle" letter-spacing="8" filter="url(#glow)">
    DOOM-FLY
  </text>

  <!-- Subtitle -->
  <text x="600" y="365" font-family="monospace, sans-serif" font-size="24" font-weight="700" fill="#E5E5E5" text-anchor="middle" letter-spacing="4">
    VIRTUAL DROSOPHILA CONNECTOME PLAYS 3D DOOM
  </text>

  <!-- Scientific Description -->
  <text x="600" y="420" font-family="monospace, sans-serif" font-size="16" fill="#888888" text-anchor="middle" letter-spacing="1">
    Biological 16-Wedge Ring Attractor • FlyWire FAFB Whole-Brain Dataset • 60 FPS Raycaster
  </text>

  <!-- Feature Pills -->
  <g transform="translate(240, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="42" rx="4" fill="#0C1410" stroke="#00FF88" stroke-width="1" />
    <text x="110" y="26" font-family="monospace, sans-serif" font-size="12" font-weight="700" fill="#00FF88" text-anchor="middle">🧠 FAFB CONNECTOME</text>

    <!-- Pill 2 -->
    <rect x="250" y="0" width="220" height="42" rx="4" fill="#1C0D12" stroke="#FF1E56" stroke-width="1" />
    <text x="360" y="26" font-family="monospace, sans-serif" font-size="12" font-weight="700" fill="#FF1E56" text-anchor="middle">🎮 3D DOOM RAYCASTER</text>

    <!-- Pill 3 -->
    <rect x="500" y="0" width="220" height="42" rx="4" fill="#0D141C" stroke="#00E5FF" stroke-width="1" />
    <text x="610" y="26" font-family="monospace, sans-serif" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle">📱 MOBILE GAMEPAD</text>
  </g>

  <!-- Bottom Attribution -->
  <text x="600" y="565" font-family="monospace, sans-serif" font-size="12" fill="#555555" text-anchor="middle" letter-spacing="2">
    POWERED BY FLYWIRE FAFB (NATURE 2024) • AUTONOMOUS NEURAL AGENT
  </text>
</svg>
